<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloudplay admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Cloudplay admin</h1>
  <a class="link" href="/">Back to site</a>
</header>
<main>
  <form id="login" class="login">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <section id="panel" hidden>
    <p><button id="refresh">Refresh</button> <button id="logout" class="link">Sign out</button></p>
    <ul id="pods" class="pods"></ul>
  </section>
  <p id="msg" role="status"></p>
</main>
<script src="admin.js"></script>
</body>
</html>
